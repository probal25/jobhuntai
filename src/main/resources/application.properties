# ============================================================
# SERVER
# ============================================================
server.port=8080

# ============================================================
# OLLAMA (local LLM - no API tokens, runs on your machine)
# ============================================================
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.model=qwen2.5:7b
spring.ai.ollama.chat.options.temperature=0.1
spring.ai.ollama.chat.options.num-ctx=8192
spring.ai.ollama.chat.options.num-predict=4096

# ============================================================
# MYSQL DATABASE
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/jobagent?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=password

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# THYMELEAF (no caching during local development)
# ============================================================
spring.thymeleaf.cache=false

